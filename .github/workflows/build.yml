name: Compilar USBS2.nro (Switch 2 / ounce-devkit)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Misma base que el Dockerfile oficial de ouncebrew/ounce-devkit
    container: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ounce-devkit (libounce, ouncevk, libkaihen)
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL -o /tmp/install.sh https://raw.githubusercontent.com/ouncebrew/ounce-devkit/main/install.sh
          sh /tmp/install.sh
      - name: Compilar
        run: |
          make -j$(nproc)
          make -C probe -j$(nproc)
          cp probe/usbprobe.nro .
      - uses: actions/upload-artifact@v4
        with:
          name: USBS2
          path: |
            USBS2.nro
            usbprobe.nro
      - name: Publicar en Releases (ultima version)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: USBS2 (ultima compilacion, Switch 2)
          prerelease: true
          files: |
            USBS2.nro
            usbprobe.nro
