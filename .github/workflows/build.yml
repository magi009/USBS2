name: Compilar USBS2.nro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: USBS2
          path: USBS2.nro
