name: Compilar USBS2.nro

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: USBS2
          path: USBS2.nro
      - name: Publicar en Releases (ultima version)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: USBS2 (ultima compilacion)
          prerelease: true
          files: USBS2.nro
