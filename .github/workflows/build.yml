name: Compilar USBS2.nro (Switch 2 / ounce-devkit)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Misma base que el Dockerfile oficial de ouncebrew/ounce-devkit
    container: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Compilar libounce (con parches de patches/)
        env:
          LIBOUNCE_REF: 7270a6acee972acf628c482e577b53c7e6f02e76
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          git clone https://github.com/ouncebrew/libounce /tmp/libounce
          cd /tmp/libounce && git checkout "$LIBOUNCE_REF"
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            [ -e "$p" ] || continue
            echo "Aplicando $p"; git apply "$p"
          done
          make -j$(nproc) && make install
      - name: Compilar
        run: |
          make -j$(nproc)
          make -C probe -j$(nproc)
          cp probe/usbprobe.nro .
      - uses: actions/upload-artifact@v4
        with:
          name: USBS2
          path: |
            USBS2.nro
            USBS2.elf
            usbprobe.nro
      - name: Publicar en Releases (ultima version)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: USBS2 (ultima compilacion, Switch 2)
          prerelease: true
          files: |
            USBS2.nro
            USBS2.elf
            usbprobe.nro
